name: verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # TODO(onboarding): install the toolchain that the checks in .ai/config.json need (runtime, package manager, dependencies).

      - name: Doctor
        run: python3 tool/ai.py doctor

      - name: Verify
        run: python3 tool/ai.py verify --all --id "ci-${{ github.run_id }}"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: .ai/runs/
          if-no-files-found: ignore
